<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Talk to Sam | All Star A/C, Plumbing & Electrical</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      color: #172033;
      background: linear-gradient(135deg, #eaf7ff, #f7fbff);
    }

    .card {
      width: 100%;
      max-width: 620px;
      padding: 48px 30px;
      text-align: center;
      background: #ffffff;
      border-radius: 22px;
      box-shadow: 0 18px 50px rgba(0, 56, 96, 0.15);
    }

    h1 {
      margin: 0 0 16px;
      color: #075985;
      font-size: clamp(2rem, 6vw, 3.3rem);
    }

    p {
      max-width: 480px;
      margin: 0 auto 14px;
      color: #475569;
      font-size: 1.1rem;
      line-height: 1.7;
    }

    .notice {
      margin-top: 24px;
      padding: 14px;
      color: #075985;
      background: #e0f2fe;
      border-radius: 12px;
      font-size: 0.95rem;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>Talk to Sam</h1>

    <p>
      Sam is the virtual receptionist for All Star A/C, Plumbing  &amp; & Electrical.
    </p>

    <p>
      Select the call button in the bottom-right corner to start.
    </p>

    <div class="notice">
      When your browser asks for permission, select
      <strong>Allow microphone</strong>.
    </div>
  </main>

  <script>
    var vapiInstance = null;

    const assistant = "9cd26fc5-2249-40c1-8dfb-61b15c0038ff";
    const apiKey = "e82d2f13-8b4f-4826-a8c9-986a4d62aecc";

    const buttonConfig = {
      position: "bottom-right"
    };

    (function (documentObject, tagName) {
      const script = documentObject.createElement(tagName);
      const firstScript =
        documentObject.getElementsByTagName(tagName)[0];

      script.src =
        "https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js";

      script.defer = true;
      script.async = true;

      firstScript.parentNode.insertBefore(script, firstScript);

      script.onload = function () {
        vapiInstance = window.vapiSDK.run({
          apiKey: apiKey,
          assistant: assistant,
          config: buttonConfig
        });
      };
    })(document, "script");
  </script>
</body>
</html>
